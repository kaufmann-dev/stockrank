[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockrank"
version = "1.0.0"
description = "Rank stock universes with fresh evidence, OpenAI-compatible judges, and Plackett-Luce."
requires-python = ">=3.11"
dependencies = [
  "choix>=0.4.1",
  "httpx>=0.27",
  "keyring>=25.7",
  "numpy>=2.0",
  "openai>=2.11",
  "pydantic>=2.7",
  "rich>=13.7",
  "tomli-w>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
stockrank = "stockrank.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockrank = ["starter/*.toml", "starter/modes/*.toml", "starter/universes/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
